name: _
publish_to: none
environment:
  sdk: ^3.6.0
workspace:
  - packages/tiny_pkce_launcher
  - packages/tiny_pkce
  - apps/example
dev_dependencies:
  melos: ^7.4.1

melos:
  repository: https://github.com/ElectricCookie/tiny_pkce
  scripts:
    analyze:
      exec: dart analyze .
    test:selective_unit_test:
      run: melos exec --dir-exists="test" --fail-fast -- flutter test --no-pub --coverage
      description: Run Flutter tests for a specific package in this project.
      packageFilters:
        flutter: true
        dirExists: test
    test:
      run: melos run test:selective_unit_test --no-select
      description: Run all  tests in this project.
    gen_coverage:
      run: melos exec -- "\$MELOS_ROOT_PATH/combine_coverage.sh"
      description: Generate coverage report for this project.
    format:
      run: melos exec -- dart format --output=none --set-exit-if-changed .
      description: Format all packages in this project.
    dry_run_publish:
      run: melos exec --no-private -- flutter pub publish --dry-run
      description: Dry run publish all packages in this project. Where publish_to is not none.
